<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveDub — Settings</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎙</span>
        <h1>LiveDub</h1>
      </div>
      <p class="subtitle">实时语音翻译 · 设置</p>
    </header>

    <main class="main">
      <!-- API Key Section -->
      <section class="card">
        <h2>🔑 Microsoft Translator API</h2>
        <p class="hint">
          需要 Azure 订阅密钥才能使用翻译功能。免费层每月 200 万字符。
          <a href="https://portal.azure.com/#create/Microsoft.CognitiveServicesTextTranslation" target="_blank" rel="noopener">
            获取 API Key →
          </a>
        </p>

        <div class="form-group">
          <label for="apiKey">API Key</label>
          <input type="password" id="apiKey" placeholder="输入你的 API Key…" autocomplete="off" />
        </div>

        <div class="form-group">
          <label for="region">区域 (Region)</label>
          <select id="region">
            <option value="eastasia">East Asia (东亚 — 推荐中国大陆)</option>
            <option value="southeastasia">Southeast Asia (东南亚)</option>
            <option value="eastus">East US (美国东部)</option>
            <option value="westeurope">West Europe (欧洲西部)</option>
            <option value="japaneast">Japan East (日本东部)</option>
            <option value="global">Global (全球)</option>
          </select>
        </div>
      </section>

      <!-- TTS Settings -->
      <section class="card">
        <h2>🔊 语音合成 (TTS)</h2>

        <div class="form-group">
          <label for="ttsVolume">默认音量</label>
          <div class="range-row">
            <input type="range" id="ttsVolume" min="0" max="100" value="100" />
            <span class="range-value" id="ttsVolumeDisplay">100%</span>
          </div>
        </div>

        <div class="form-group">
          <label for="ttsRate">朗读速度</label>
          <div class="range-row">
            <input type="range" id="ttsRate" min="50" max="200" value="110" />
            <span class="range-value" id="ttsRateDisplay">1.1x</span>
          </div>
        </div>
      </section>

      <!-- Mix Settings -->
      <section class="card">
        <h2>🎵 音频混合</h2>

        <div class="form-group">
          <label for="mixRatio">默认原声比例</label>
          <div class="range-row">
            <input type="range" id="mixRatio" min="0" max="100" value="30" />
            <span class="range-value" id="mixRatioDisplay">30%</span>
          </div>
          <p class="hint">0% = 完全静音原声，100% = 原声满音量。翻译语音始终独立输出。</p>
        </div>
      </section>

      <!-- Language -->
      <section class="card">
        <h2>🌐 语言设置（预留）</h2>

        <div class="form-row">
          <div class="form-group">
            <label for="fromLang">源语言</label>
            <select id="fromLang">
              <option value="en">English (英语)</option>
              <option value="ja" disabled>日本語 (即将支持)</option>
              <option value="ko" disabled>한국어 (即将支持)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="toLang">目标语言</label>
            <select id="toLang">
              <option value="zh-Hans">中文（简体）</option>
              <option value="en" disabled>English (即将支持)</option>
            </select>
          </div>
        </div>
      </section>

      <!-- Save -->
      <div class="actions">
        <button id="saveBtn" class="btn-primary">💾 保存设置</button>
        <span id="saveStatus" class="save-status"></span>
      </div>
    </main>

    <footer class="footer">
      <p>LiveDub v0.1.0 — Made with ❤️</p>
    </footer>
  </div>

  <script src="index.js"></script>
</body>
</html>
